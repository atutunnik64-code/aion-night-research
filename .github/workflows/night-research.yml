name: AION Night Research

on:
  schedule:
    - cron: "7 * * * *"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "cloud/**"
      - "requirements.txt"
      - ".github/workflows/night-research.yml"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Test/runtime seconds"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: aion-night-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run public research collectors
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            D="${{ inputs.duration_seconds }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            D="180"
          else
            D="3480"
          fi
          export AION_NIGHT_DURATION_SEC="$D"
          PYTHONPATH=. python cloud/night_agent.py
      - name: Build evidence dashboard
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python cloud/research_evidence_dashboard.py
      - name: Validate research state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          unrecoverable = []
          restored = []
          for p in sorted(Path("data").rglob("*.json")):
              rel = p.as_posix()
              try:
                  raw = p.read_text(encoding="utf-8-sig")
                  if not raw.strip():
                      raise ValueError("zero-byte/blank JSON")
                  json.loads(raw)
                  continue
              except Exception as current_exc:
                  try:
                      old = subprocess.check_output(
                          ["git", "show", f"HEAD:{rel}"], stderr=subprocess.DEVNULL
                      )
                      old_text = old.decode("utf-8-sig")
                      if not old_text.strip():
                          raise ValueError("baseline is also blank")
                      json.loads(old_text)
                      p.write_bytes(old)
                      restored.append((rel, str(current_exc)))
                  except Exception as baseline_exc:
                      unrecoverable.append((rel, str(current_exc), str(baseline_exc)))

          for rel, reason in restored:
              print(f"STATE_RESTORED {rel}: {reason}")
          if unrecoverable:
              for rel, cur, base in unrecoverable:
                  print(f"STATE_INVALID {rel}: current={cur}; baseline={base}")
              raise SystemExit("refusing to persist invalid research JSON")
          print("STATE_JSON_VALIDATION_OK")
          PY
      - name: Persist research state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aion-night-bot"
          git config user.email "aion-night-bot@users.noreply.github.com"

          # Preserve the freshly collected cloud state. The local Windows Bybit
          # relay may publish a newer compact snapshot while this run is active,
          # so each persistence attempt re-reads that relay from current origin/main
          # and lets the newer relay win over the run-start copy.
          rm -rf /tmp/aion-data
          cp -a data /tmp/aion-data

          for attempt in 1 2 3; do
            echo "PERSIST_ATTEMPT=$attempt"
            git fetch origin main

            rm -f /tmp/bybit-relay-latest.json
            if git show origin/main:data/bybit_local_relay_v1.json > /tmp/bybit-relay-latest.json 2>/dev/null; then
              echo "BYBIT_RELAY_FROM_ORIGIN=1"
            else
              rm -f /tmp/bybit-relay-latest.json
              echo "BYBIT_RELAY_FROM_ORIGIN=0"
            fi

            git reset --hard origin/main
            rm -rf data
            cp -a /tmp/aion-data data
            if [ -s /tmp/bybit-relay-latest.json ]; then
              cp /tmp/bybit-relay-latest.json data/bybit_local_relay_v1.json
            fi

            python - <<'PY'
          import json
          from pathlib import Path
          bad=[]
          for p in sorted(Path("data").rglob("*.json")):
              try:
                  raw=p.read_text(encoding="utf-8-sig")
                  if not raw.strip(): raise ValueError("blank")
                  json.loads(raw)
              except Exception as exc:
                  bad.append(f"{p.as_posix()}: {exc}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("invalid JSON after snapshot restore")
          print("POST_RESTORE_JSON_VALIDATION_OK")
          PY

            git add data/
            if git diff --cached --quiet; then
              echo "No research-state changes"
              exit 0
            fi
            git commit -m "research: cloud snapshot"
            if git push origin HEAD:main; then
              echo "PERSIST_OK attempt=$attempt"
              exit 0
            fi
            echo "PERSIST_RETRY attempt=$attempt"
          done

          echo "PERSIST_FAILED_AFTER_RETRIES"
          exit 1
