name: AION Night Research

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Test/runtime seconds"
        required: false
        default: "120"

permissions:
  contents: write

concurrency:
  group: aion-night-research
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run public research collectors
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            D="${{ inputs.duration_seconds }}"
          else
            D="3480"
          fi
          export AION_NIGHT_DURATION_SEC="$D"
          PYTHONPATH=. python cloud/night_agent.py
      - name: Persist research state
        shell: bash
        run: |
          git config user.name "aion-night-bot"
          git config user.email "aion-night-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No research-state changes"
            exit 0
          fi
          git commit -m "research: hourly public snapshot"
          git pull --rebase origin main
          git push origin HEAD:main

